name: CI - Build and Push Docker Image #name of the pipeline

on:
  push:
    branches:
      - master # trigger the pipeline when there is a push to the master branch.

jobs:
  build-and-push:
    runs-on: ubuntu-latest # the pipeline will run on the latest version of Ubuntu in github servers.

    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # this step checks out the code from the repository to the ubuntu machine so that it can be used in the next steps.

      - name: Login to Docker Hub
        uses: docker/login-action@v3 # this step logs into Docker Hub using the credentials stored in the repository secrets.
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: . # the context is set to the current directory where the Dockerfile is located.
          push: true # this option tells the action to push the image to Docker Hub after building it.
          tags: ${{ secrets.DOCKER_USERNAME }}/docker_githubactions:latest # the tag for the Docker image, which includes the Docker Hub username and the name of the image. The "latest" tag indicates that this is the most recent version of the image.

      - name: Trigger Render Deploy
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }} # this step triggers a deployment on Render using a webhook URL stored in the repository secrets. This allows the newly built Docker image to be deployed to the Render platform automatically after it is pushed to Docker Hub.